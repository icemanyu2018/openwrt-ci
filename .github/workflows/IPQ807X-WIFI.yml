name: Build Redmi AX6 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: configs/ipq807x.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-script.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        [ -n "$(docker images -q)" ] && docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android $AGENT_TOOLSDIRECTORY || true
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* google-chrome-stable mono-devel libgl1-mesa-dri || true
        sudo -E apt-get -y update
        sudo -E apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
          gcc-multilib g++-multilib git haveged help2man libc6-dev-i386 libglib2.0-dev \
          libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
          libssl-dev libxml2-utils libz-dev lrzsz msmtp nano p7zip p7zip-full patch \
          pkgconf python3 python3-pip python3-ply python3-docutils qemu-utils rsync \
          subversion swig texinfo u-boot-tools unzip upx-ucl xmlto zlib1g-dev clang llvm
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge || true
        sudo -E apt-get -y clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code(克隆源码)
      run: |
        df -h $GITHUB_WORKSPACE
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf $GITHUB_WORKSPACE/openwrt openwrt

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default || true
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        # 自动兼容根目录与 configs 目录下的配置文件
        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          echo "成功应用配置文件: $CONFIG_FILE"
        elif [ -f "$GITHUB_WORKSPACE/configs/$CONFIG_FILE" ]; then
          cp -f "$GITHUB_WORKSPACE/configs/$CONFIG_FILE" .config
          echo "成功应用配置文件: configs/$CONFIG_FILE"
        else
          echo "致命错误: 未找到 $CONFIG_FILE 配置文件！"
          exit 1
        fi

    - name: Update & Install Feeds(更新并安装源)
      run: |
        cd openwrt
        ./scripts/feeds update -a
        # 拦截：在 install 之前清理官方 Feeds 中与 small-package 重叠的冲突包
        rm -rf feeds/packages/net/mosdns || true
        rm -rf feeds/packages/net/msd_lite || true
        rm -rf feeds/packages/net/smartdns || true
        rm -rf feeds/luci/themes/luci-theme-argon || true
        rm -rf feeds/luci/applications/luci-app-mosdns || true
        rm -rf feeds/luci/applications/luci-app-netdata || true
        ./scripts/feeds install -a

    - name: Download Package(下载软件包)
      id: package
      run: |
        cd openwrt
        # 再次覆盖配置以防 feeds install 变动
        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        elif [ -f "$GITHUB_WORKSPACE/configs/$CONFIG_FILE" ]; then
          cp -f "$GITHUB_WORKSPACE/configs/$CONFIG_FILE" .config
        fi
        
        make defconfig
        
        # 核心卡点：若 Target 被重置为 x86 则立刻终止
        TARGET_BOARD=$(grep "CONFIG_TARGET_BOARD=" .config | cut -d'"' -f2)
        echo "=========================================="
        echo "当前生成的 Target 架构为: $TARGET_BOARD"
        echo "=========================================="
        if [ "$TARGET_BOARD" = "x86" ]; then
          echo "致命错误: 配置未生效，系统退回到了 x86！请检查 Target 设置！"
          exit 1
        fi

        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd openwrt
        
        # 1. 强制将系统的 clang/llvm 注入到 OpenWrt host 链
        mkdir -p staging_dir/host/bin
        ln -sf $(which clang) staging_dir/host/bin/clang
        ln -sf $(which clang++) staging_dir/host/bin/clang++
        ln -sf $(which llvm-strip) staging_dir/host/bin/llvm-strip 2>/dev/null || true
        ln -sf $(which llc) staging_dir/host/bin/llc 2>/dev/null || true
        ln -sf $(which opt) staging_dir/host/bin/opt 2>/dev/null || true

        # 2. 彻底杜绝 include/bpf.mk 判定失效
        if [ -f "include/bpf.mk" ]; then
          sed -i "s|/invalid/clang|$(which clang)|g" include/bpf.mk
          sed -i "s|/invalid/llc|$(which llc)|g" include/bpf.mk 2>/dev/null || true
        fi
        
        echo -e "$(nproc) thread compile"
        PATH="$(pwd)/staging_dir/host/bin:$PATH" \
        CLANG="$(which clang)" \
        LLC="$(which llc)" \
        KERNEL_BPF_CLANG="$(which clang)" \
        make -j$(nproc) CLANG="$(which clang)" LLC="$(which llc)" || make -j1 V=s

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: |
        df -h

    - name: Organize Files(整理文件)
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt
        TARGET_DIR=$(find bin/targets/ -mindepth 2 -maxdepth 2 -type d 2>/dev/null | head -n 1)
        if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
          rm -rf "$TARGET_DIR/packages" || true
          echo "FIRMWARE=$GITHUB_WORKSPACE/openwrt/$TARGET_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        fi

    - name: Upload Firmware To Artifact(将固件上传到Artifact)
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_Redmi_AX6
        path: openwrt/bin/targets/*/*
